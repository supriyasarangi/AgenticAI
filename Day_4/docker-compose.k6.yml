services:
  influxdb:
    image: influxdb:1.8
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_FLUX_ENABLED=true
    ports:
      - "8086:8086" # k6 --out influxdb=http://localhost:8086/k6 writes here from the host
    networks:
      - observability

networks:
  observability:
    external: true
    name: day_4_observability
