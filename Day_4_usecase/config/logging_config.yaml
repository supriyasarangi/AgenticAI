version: 1
disable_existing_loggers: false

formatters:
  structured:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: structured
    stream: ext://sys.stdout

loggers:
  orchestration:
    level: INFO
    handlers: [console]
  ingestion:
    level: INFO
    handlers: [console]
  agents:
    level: INFO
    handlers: [console]

root:
  level: INFO
  handlers: [console]
